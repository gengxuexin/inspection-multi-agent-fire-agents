name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ---------- 快速检查：语法 + lint + 类型 ----------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff 静态检查
        run: ruff check . --output-format=github

      - name: Ruff 格式检查
        run: ruff format --check . --exclude agent1/knowledge_base

      - name: Mypy 类型检查（共享包与编排层）
        run: mypy common gateway.py orchestrator_langgraph.py

  # ---------- 单元测试 ----------
  test:
    name: Unit Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install pydantic-settings PyJWT fastapi httpx

      - name: 运行测试
        run: pytest tests/ -v --cov=common --cov-report=xml --cov-report=term

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.10'
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  # ---------- Docker 镜像构建验证 ----------
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: 构建 Gateway 镜像
        run: docker build -f deploy/docker/gateway.Dockerfile -t fire-agents/gateway:ci .

      - name: 构建 Agent1 镜像
        run: docker build -f deploy/docker/agent1.Dockerfile -t fire-agents/agent1:ci .

      - name: 校验 compose 配置
        run: docker compose -f deploy/docker/docker-compose.yml config --quiet
